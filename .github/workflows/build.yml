name: Build BD PBX Connect

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: Win32

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Apply BD PBX account UI
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}"

          # Replace the old three-host account form with the BD PBX tenant form.
          $dialogPath = Join-Path $env:GITHUB_WORKSPACE "res\dialog.rc2"
          $dialog = Get-Content -Raw -Path $dialogPath
          $marker = '//-----------------------------ACCOUNT------------------------------------------'
          $start = $dialog.IndexOf($marker)
          $next = $dialog.IndexOf('//-----------------------------------------------------------------------', $start + $marker.Length)
          if ($start -lt 0 -or $next -lt 0) { throw "BD PBX account dialog section was not found" }
          $end = $dialog.IndexOf('//-----------------------------------------------------------------------', $next + 1)
          if ($end -lt 0) { throw "BD PBX account dialog end marker was not found" }

          $accountSection = @'
//-----------------------------ACCOUNT------------------------------------------
#define IDD_ACCOUNT_OFF_FINAL 445

IDD_ACCOUNT DIALOGEX 0, 0, 360, IDD_ACCOUNT_OFF_FINAL
STYLE DS_SETFONT | WS_CAPTION | WS_SYSMENU | DS_MODALFRAME | WS_POPUP | WS_VISIBLE
CAPTION "BD PBX - Add Account"
FONT 8, "Microsoft Sans Serif", 400, 0, 0x1
BEGIN
RTEXT           "Account Name", IDC_STATIC, 10, 12, 90, 8, SS_WORDELLIPSIS
EDITTEXT        IDC_ACCOUNT_LABEL, 105, 9, 105, 16, ES_AUTOHSCROLL

RTEXT           "Domain (Subdomain) *", IDC_STATIC, 10, 39, 90, 18, SS_WORDELLIPSIS
EDITTEXT        IDC_EDIT_DOMAIN, 105, 36, 105, 16, ES_AUTOHSCROLL
LTEXT           ".bdpbx.com", IDC_STATIC, 214, 40, 58, 8
LTEXT           "Full domain will be: company1.bdpbx.com (auto)", IDC_STATIC, 105, 56, 165, 18

GROUPBOX        "Automatic Configuration", IDC_ACCOUNT_WELCOME2, 225, 8, 125, 145
LTEXT           "You only need to enter your subdomain.", IDC_STATIC, 234, 27, 108, 25
LTEXT           "Example: company1", IDC_STATIC, 234, 55, 108, 10
LTEXT           "SIP Server  ->  company1.bdpbx.com", IDC_STATIC, 234, 73, 108, 25
LTEXT           "SIP Proxy   ->  company1.bdpbx.com", IDC_STATIC, 234, 101, 108, 25
LTEXT           "Domain      ->  company1.bdpbx.com", IDC_STATIC, 234, 129, 108, 18

RTEXT           "Username *", IDC_STATIC, 10, 86, 90, 8, SS_WORDELLIPSIS
EDITTEXT        IDC_EDIT_USERNAME, 105, 83, 105, 16, ES_AUTOHSCROLL
LTEXT           "(used as Username and Login)", IDC_STATIC, 105, 101, 110, 18

RTEXT           "Password *", IDC_STATIC, 10, 124, 90, 8, SS_WORDELLIPSIS
EDITTEXT        IDC_EDIT_PASSWORD, 105, 121, 105, 16, ES_AUTOHSCROLL | ES_PASSWORD
CONTROL         "", IDC_SYSLINK_DISPLAY_PASSWORD, "SysLink", WS_TABSTOP, 105, 140, 105, 8

RTEXT           "Display Name", IDC_STATIC, 10, 164, 90, 8, SS_WORDELLIPSIS
EDITTEXT        IDC_EDIT_DISPLAYNAME, 105, 161, 105, 16, ES_AUTOHSCROLL
RTEXT           "Voicemail Number", IDC_STATIC, 10, 187, 90, 8, SS_WORDELLIPSIS
EDITTEXT        IDC_EDIT_VOICEMAIL, 105, 184, 105, 16, ES_AUTOHSCROLL
RTEXT           "Dialing Prefix", IDC_STATIC, 10, 210, 90, 8, SS_WORDELLIPSIS
EDITTEXT        IDC_ACCOUNT_DIALING_PREFIX, 105, 207, 105, 16, ES_AUTOHSCROLL
RTEXT           "Dial Plan", IDC_STATIC, 10, 233, 90, 8, SS_WORDELLIPSIS
EDITTEXT        IDC_ACCOUNT_DIAL_PLAN, 105, 230, 105, 16, ES_AUTOHSCROLL
CONTROL         "Hide Caller ID", IDC_ACCOUNT_HIDE_CID, "Button", BS_AUTOCHECKBOX | WS_TABSTOP, 105, 252, 105, 12

RTEXT           "Media Encryption", IDC_STATIC, 10, 277, 90, 8, SS_WORDELLIPSIS
COMBOBOX        IDC_SRTP, 105, 274, 105, 30, CBS_DROPDOWNLIST | WS_VSCROLL | WS_TABSTOP
RTEXT           "Transport", IDC_STATIC, 10, 311, 90, 8, SS_WORDELLIPSIS
COMBOBOX        IDC_TRANSPORT, 105, 308, 105, 30, CBS_DROPDOWNLIST | WS_VSCROLL | WS_TABSTOP
RTEXT           "Public Address", IDC_STATIC, 10, 345, 90, 8, SS_WORDELLIPSIS
COMBOBOX        IDC_PUBLIC_ADDR, 105, 342, 105, 30, CBS_DROPDOWN | WS_VSCROLL | WS_TABSTOP
RTEXT           "Register Refresh", IDC_STATIC, 10, 379, 90, 8, SS_WORDELLIPSIS
EDITTEXT        IDC_ACCOUNT_REGISTER_REFRESH, 105, 376, 45, 16, ES_AUTOHSCROLL
RTEXT           "Keep-Alive", IDC_STATIC, 155, 379, 55, 8, SS_WORDELLIPSIS
EDITTEXT        IDC_ACCOUNT_KEEP_ALIVE, 212, 376, 35, 16, ES_AUTOHSCROLL

CONTROL         "Publish Presence", IDC_PUBLISH, "Button", BS_AUTOCHECKBOX | WS_TABSTOP, 250, 175, 100, 12
CONTROL         "Allow IP Rewrite", IDC_REWRITE, "Button", BS_AUTOCHECKBOX | WS_TABSTOP, 250, 198, 100, 12
CONTROL         "ICE", IDC_ICE, "Button", BS_AUTOCHECKBOX | WS_TABSTOP, 250, 221, 100, 12
CONTROL         "Disable Session Timers", IDC_SESSION_TIMER, "Button", BS_AUTOCHECKBOX | WS_TABSTOP, 250, 244, 100, 12

CONTROL         "", IDC_SYSLINK_ACCOUNT_DELETE, "SysLink", 0x0, 10, 418, 75, 8, NOT WS_VISIBLE
DEFPUSHBUTTON   "Save", IDOK, 110, 414, 80, 18
PUSHBUTTON      "Cancel", IDCANCEL, 195, 414, 80, 18
END
//-----------------------------------------------------------------------
'@
          $dialog = $dialog.Substring(0, $start) + $accountSection + $dialog.Substring($end)
          Set-Content -Path $dialogPath -Value $dialog -Encoding utf8

          # Make the existing account logic use the tenant subdomain and hide the legacy fields safely.
          $cppPath = Join-Path $env:GITHUB_WORKSPACE "AccountDlg.cpp"
          $cpp = Get-Content -Raw -Path $cppPath
          $cpp = $cpp.Replace('CDialog::OnInitDialog();', 'CDialog::OnInitDialog();`r`n`r`n`tSetWindowText(_T("BD PBX - Add Account"));')
          $cpp = $cpp.Replace('GetDlgItem(IDC_ACCOUNT_REQUIRED_USERNAME)->ShowWindow(show);`r`n`tGetDlgItem(IDC_ACCOUNT_REQUIRED_DOMAIN)->ShowWindow(show);`r`n`tGetDlgItem(IDC_EDIT_SERVER)->EnableWindow(id);', 'GetDlgItem(IDC_PUBLISH)->EnableWindow(id);')
          $cpp = $cpp.Replace('GetDlgItem(IDC_PUBLISH)->EnableWindow(id);`r`n`tGetDlgItem(IDC_ACCOUNT_REGISTER_REFRESH)->EnableWindow(id);', 'GetDlgItem(IDC_ACCOUNT_REGISTER_REFRESH)->EnableWindow(id);')
          $oldLoad = @'
	edit = (CEdit*)GetDlgItem(IDC_ACCOUNT_LABEL);
	edit->SetWindowText(m_Account.label);

	edit = (CEdit*)GetDlgItem(IDC_EDIT_SERVER);
	edit->SetWindowText(m_Account.server);
	edit = (CEdit*)GetDlgItem(IDC_EDIT_PROXY);
	edit->SetWindowText(m_Account.proxy);
	edit = (CEdit*)GetDlgItem(IDC_EDIT_DOMAIN);
	edit->SetWindowText(m_Account.domain);

	edit = (CEdit*)GetDlgItem(IDC_EDIT_AUTHID);
	edit->SetWindowText(m_Account.authID);

	edit = (CEdit*)GetDlgItem(IDC_EDIT_USERNAME);
	edit->SetWindowText(m_Account.username);
'@
          $newLoad = @'
	edit = (CEdit*)GetDlgItem(IDC_ACCOUNT_LABEL);
	if (m_Account.label.IsEmpty()) {
		m_Account.label = _T("Account 1");
	}
	edit->SetWindowText(m_Account.label);

	edit = (CEdit*)GetDlgItem(IDC_EDIT_DOMAIN);
	CString tenantDomain = m_Account.domain;
	CString tenantSuffix = _T(".bdpbx.com");
	if (tenantDomain.Right(tenantSuffix.GetLength()).CompareNoCase(tenantSuffix) == 0) {
		tenantDomain = tenantDomain.Left(tenantDomain.GetLength() - tenantSuffix.GetLength());
	}
	edit->SetWindowText(tenantDomain);

	edit = (CEdit*)GetDlgItem(IDC_EDIT_USERNAME);
	edit->SetWindowText(m_Account.username);
'@
          if (-not $cpp.Contains($oldLoad)) { throw "AccountDlg Load block not found" }
          $cpp = $cpp.Replace($oldLoad, $newLoad)

          $oldSave = @'
	edit = (CEdit*)GetDlgItem(IDC_EDIT_SERVER);
	edit->GetWindowText(str);
	m_Account.server=str.Trim();
	edit = (CEdit*)GetDlgItem(IDC_EDIT_PROXY);
	edit->GetWindowText(str);
	m_Account.proxy=str.Trim();
	edit = (CEdit*)GetDlgItem(IDC_EDIT_DOMAIN);
	edit->GetWindowText(str);
	m_Account.domain=str.Trim();

	edit = (CEdit*)GetDlgItem(IDC_EDIT_AUTHID);
	edit->GetWindowText(str);
	m_Account.authID=str.Trim();

	edit = (CEdit*)GetDlgItem(IDC_EDIT_USERNAME);
	edit->GetWindowText(str);
	m_Account.username=str.Trim();
'@
          $newSave = @'
	edit = (CEdit*)GetDlgItem(IDC_EDIT_DOMAIN);
	edit->GetWindowText(str);
	str = str.Trim();
	str.Trim(_T('.'));
	CString tenantSuffix = _T(".bdpbx.com");
	if (str.Right(tenantSuffix.GetLength()).CompareNoCase(tenantSuffix) == 0) {
		str = str.Left(str.GetLength() - tenantSuffix.GetLength());
		str.Trim(_T('.'));
	}
	m_Account.domain = str + tenantSuffix;

	edit = (CEdit*)GetDlgItem(IDC_EDIT_USERNAME);
	edit->GetWindowText(str);
	m_Account.username=str.Trim();
	m_Account.authID=m_Account.username;
	m_Account.server=m_Account.domain;
	m_Account.proxy=m_Account.domain;
'@
          if (-not $cpp.Contains($oldSave)) { throw "AccountDlg save block not found" }
          $cpp = $cpp.Replace($oldSave, $newSave)
          Set-Content -Path $cppPath -Value $cpp -Encoding utf8
          Write-Host "BD PBX tenant account UI and automatic SIP host configuration applied"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x86

      - name: Install Dependencies
        shell: pwsh
        run: |
          choco install 7zip -y
          choco install innosetup -y

      - name: Setup Opus
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}"
          Invoke-WebRequest -Uri "https://github.com/xiph/opus/archive/refs/tags/v1.5.2.zip" -OutFile "opus.zip"
          if (Test-Path "opus-src") { Remove-Item "opus-src" -Recurse -Force }
          if (Test-Path "opus-build") { Remove-Item "opus-build" -Recurse -Force }
          Expand-Archive -Path "opus.zip" -DestinationPath "." -Force
          $opusDir = Get-ChildItem -Directory | Where-Object { $_.Name -like "opus-1.5.2*" } | Select-Object -First 1
          if (-not $opusDir) { throw "Opus source not found" }
          Rename-Item $opusDir.FullName "opus-src"
          cmake -S opus-src -B opus-build -G "Visual Studio 17 2022" -A Win32 -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF -DOPUS_STATIC_RUNTIME=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build opus-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $opusLib = Get-ChildItem opus-build -Recurse -Filter opus.lib | Select-Object -First 1
          if (-not $opusLib) { throw "opus.lib not found" }
          $root = "${{ github.workspace }}\.."
          $dest = Join-Path $root "third_party\opus\Win32"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $opusLib.FullName (Join-Path $dest "opus.lib") -Force
          Copy-Item $opusLib.FullName (Join-Path $dest "libopus.a") -Force
          Write-Host "Opus libraries ready: $(Join-Path $dest 'opus.lib') and $(Join-Path $dest 'libopus.a')"

      - name: Download and Build PJSIP
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\.."
          $root = Get-Location
          if (Test-Path "pjproject") { Remove-Item "pjproject" -Recurse -Force }
          Invoke-WebRequest -Uri "https://github.com/pjsip/pjproject/archive/refs/tags/2.15.1.zip" -OutFile "pjproject.zip" -TimeoutSec 120
          Expand-Archive -Path "pjproject.zip" -DestinationPath "." -Force
          Rename-Item "pjproject-2.15.1" "pjproject"
          $pjRoot = Join-Path $root "pjproject"
          $opusInclude = Join-Path $env:GITHUB_WORKSPACE "opus-src\include"
          $pjOpusInclude = Join-Path $pjRoot "third_party\opus"
          New-Item -ItemType Directory -Force -Path $pjOpusInclude | Out-Null
          Copy-Item (Join-Path $opusInclude "*") $pjOpusInclude -Recurse -Force
          if (-not (Test-Path (Join-Path $pjOpusInclude "opus.h"))) { throw "PJSIP Opus header was not copied" }
          Write-Host "PJSIP Opus header ready: $(Join-Path $pjOpusInclude 'opus.h')"
          Set-Location $pjRoot
          $configLines = @(
            '/* BDPBXConnect PJSIP configuration */',
            '#ifndef __PJ_CONFIG_SITE_H__',
            '#define __PJ_CONFIG_SITE_H__',
            '#define PJ_CONFIG_MICROSIP 1',
            '#define PJMEDIA_HAS_VIDEO 1',
            '#define PJMEDIA_HAS_FFMPEG 0',
            '#define PJMEDIA_HAS_VPX 0',
            '#define PJMEDIA_HAS_OPUS 1',
            '#define PJMEDIA_HAS_OPUS_CODEC 1',
            '#define PJMEDIA_CODEC_OPUS_LIB_NAME "opus.lib"',
            '#define PJMEDIA_HAS_SILK 0',
            '#define PJMEDIA_HAS_SILK_CODEC 0',
            '#define PJMEDIA_HAS_G722 1',
            '#define PJMEDIA_HAS_G722_CODEC 1',
            '#define PJMEDIA_HAS_G7221 1',
            '#define PJMEDIA_HAS_G7221_CODEC 0',
            '#define PJMEDIA_HAS_G726 1',
            '#define PJMEDIA_HAS_G729 1',
            '#define PJMEDIA_HAS_GSM 0',
            '#define PJMEDIA_HAS_GSM_CODEC 0',
            '#define PJMEDIA_HAS_SPEEX 0',
            '#define PJMEDIA_HAS_SPEEX_CODEC 0',
            '#define PJMEDIA_HAS_SPEEX_AEC 0',
            '#define PJMEDIA_HAS_ILBC 0',
            '#define PJMEDIA_HAS_ILBC_CODEC 0',
            '#define PJMEDIA_HAS_SRTP 0',
            '#define PJMEDIA_HAS_TLS 1',
            '#define PJMEDIA_HAS_WEBRTC_AEC 0',
            '#define PJMEDIA_HAS_WEBRTC_VAD 0',
            '#define PJMEDIA_HAS_WEBRTC_AEC3 0',
            '#define PJMEDIA_RESAMPLE_IMP PJMEDIA_RESAMPLE_NONE',
            '#include <pj/config_site_sample.h>',
            '#endif'
          )
          Set-Content -Path "pjlib\include\pj\config_site.h" -Value $configLines
          Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Extension -in @('.vcxproj','.props') } | ForEach-Object {
            $p = $_.FullName
            $text = Get-Content -Raw -Path $p
            $text = $text -replace '<RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>', '<RuntimeLibrary>MultiThreaded</RuntimeLibrary>'
            $text = $text -replace '<RuntimeLibrary>MultiThreadedDebugDLL</RuntimeLibrary>', '<RuntimeLibrary>MultiThreadedDebug</RuntimeLibrary>'
            $text = $text -replace 'libopus\.a', 'opus.lib'
            Set-Content -Path $p -Value $text
          }
          $projects = @(
            "pjlib/build/pjlib.vcxproj",
            "pjlib-util/build/pjlib_util.vcxproj",
            "pjnath/build/pjnath.vcxproj",
            "pjmedia/build/pjmedia.vcxproj",
            "pjmedia/build/pjmedia_audiodev.vcxproj",
            "pjmedia/build/pjmedia_codec.vcxproj",
            "pjmedia/build/pjmedia_videodev.vcxproj",
            "pjsip/build/pjsip_core.vcxproj",
            "pjsip/build/pjsip_simple.vcxproj",
            "pjsip/build/pjsip_ua.vcxproj",
            "pjsip/build/pjsua_lib.vcxproj"
          )
          foreach ($proj in $projects) {
            if (Test-Path $proj) {
              Write-Host "Building $proj"
              & msbuild $proj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:RuntimeLibrary=MultiThreaded /m
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else {
              throw "Required PJSIP project not found: $proj"
            }
          }

      - name: Copy PJSIP Libraries and Headers
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\.."
          New-Item -ItemType Directory -Force -Path "lib","pjlib\include","pjlib-util\include","pjnath\include","pjmedia\include","pjsip\include" | Out-Null
          Get-ChildItem "pjproject" -Recurse -Filter "*.lib" -File | ForEach-Object { Copy-Item $_.FullName "lib\" -Force }
          Copy-Item "pjproject\pjlib\include\*" "pjlib\include\" -Recurse -Force
          Copy-Item "pjproject\pjlib-util\include\*" "pjlib-util\include\" -Recurse -Force
          Copy-Item "pjproject\pjnath\include\*" "pjnath\include\" -Recurse -Force
          Copy-Item "pjproject\pjmedia\include\*" "pjmedia\include\" -Recurse -Force
          Copy-Item "pjproject\pjsip\include\*" "pjsip\include\" -Recurse -Force
          if (-not (Test-Path "pjsip\include\pjsua-lib\pjsua.h")) { throw "pjsua.h not found" }

      - name: Prepare PJSIP Static Library
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}"
          $root = Split-Path $env:GITHUB_WORKSPACE -Parent
          $pjRoot = Join-Path $root "pjproject"
          $libDir = Join-Path $root "lib"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          $existing = @(Get-ChildItem -Path $pjRoot -Recurse -Filter "*-i386-Win32-vc14-Release.lib" -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -Unique)
          if ($existing.Count -eq 0) { throw "No PJSIP Win32 Release libraries were found" }
          Write-Host "PJSIP libraries found: $($existing.Count)"
          $existing | ForEach-Object { Write-Host "FOUND: $_" }
          $msvcRoot = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          $libExe = Get-ChildItem -Path $msvcRoot -Recurse -Filter "lib.exe" -File | Where-Object { $_.FullName -match "\\HostX86\\x86\\lib\.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $libExe) { throw "lib.exe not found" }
          $target = Join-Path $libDir "libpjproject-i386-Win32-vc14-Release-Static.lib"
          Write-Host "Using lib.exe: $($libExe.FullName)"
          & $libExe.FullName "/OUT:$target" $existing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $target)) { throw "Combined PJSIP library was not created" }
          Write-Host "Combined PJSIP library ready: $target"

      - name: Configure PJSIP Link Dependencies
        shell: pwsh
        run: |
          $proj = Join-Path $env:GITHUB_WORKSPACE "BDPBXConnect.vcxproj"
          $text = Get-Content -Raw -Path $proj
          $needle = '<AdditionalDependencies>opus.lib;Wtsapi32.lib;%(AdditionalDependencies)</AdditionalDependencies>'
          $replacement = '<AdditionalDependencies>opus.lib;Wtsapi32.lib;libpjproject-i386-Win32-vc14-Release-Static.lib;%(AdditionalDependencies)</AdditionalDependencies>'
          if (-not $text.Contains($needle)) { throw "Expected linker dependency entry not found" }
          $text = $text.Replace($needle, $replacement)
          Set-Content -Path $proj -Value $text
          Write-Host "PJSIP aggregate library added to BDPBXConnect linker inputs"

      - name: Build BD PBX Connect
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          & msbuild BDPBXConnect.vcxproj /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }} /p:PlatformToolset=v143 /p:RuntimeLibrary=MultiThreaded /p:UseEnv=false /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "BD PBX Connect build completed successfully"

      - name: Prepare Output
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}"
          New-Item -ItemType Directory -Force -Path output | Out-Null
          if (Test-Path "Release\BDPBXConnect.exe") { Copy-Item "Release\BDPBXConnect.exe" "output\" -Force } else { throw "BDPBXConnect.exe not found" }
          Get-ChildItem "Release" -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "output\" -Force

      - name: Build Windows Installer
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}"
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            $isccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $isccPath) { throw "Inno Setup compiler (ISCC.exe) not found" }
            $iscc = @{ Source = $isccPath }
          }
          & $iscc.Source "installer\BDPBXConnect.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer-output\BDPBX-Setup.exe")) { throw "Installer was not created" }
          Write-Host "Windows installer ready: installer-output\BDPBX-Setup.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDPBXConnect-Windows
          path: |
            output/
            installer-output/BDPBX-Setup.exe
